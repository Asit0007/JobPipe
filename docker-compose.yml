# The dashboard is published on 127.0.0.1 only. Reach it from outside the box
# through the Cloudflare Tunnel (see deploy/), never by opening a port.
services:
  review:
    build: .
    container_name: jobpipe-review
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./out:/app/out
      - ./config:/app/config
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Runs the pipeline on a real schedule -- see deploy/crontab.
  scheduler:
    build: .
    container_name: jobpipe-scheduler
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./out:/app/out
      - ./config:/app/config
      - ./deploy/crontab:/app/crontab:ro
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    restart: unless-stopped
