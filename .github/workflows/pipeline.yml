# MANUAL ESCAPE HATCH. Not a scheduler, on purpose -- there is no `schedule:`
# below, and adding one back is a decision, not a tidy-up.
#
# The pipeline runs on your own machine (`make daily`) or on the OCI box
# (deploy/crontab). Two reasons this is not the place for it:
#
# 1. The SQLite file IS the dedup layer, and a runner is ephemeral, so it has to
#    ride in the Actions cache. That cache is best-effort: GitHub evicts entries
#    after 7 days of no reads and when the repo's 10 GB budget fills. On a miss
#    the pipeline starts from an empty database -- every posting looks new, and
#    Telegram fills with roles you already reviewed.
# 2. It is the only option that needs your work history uploaded. profile.yaml
#    and facts.yaml are gitignored because they name your employer; running here
#    means putting ~48 KB of that into repository secrets on a public repo.
#
# Neither is fatal for a one-off catch-up run you are watching, which is exactly
# what workflow_dispatch is for. Both are disqualifying for something unattended.
#
# Gmail works here now. The OAuth flow needed a browser once and a refresh
# token written back after every rotation, which is why this used to say Gmail
# was unavailable -- but the reader moved to IMAP + an App Password, which is a
# static credential that fits a secret. Set GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD and the alert channel runs here too. That matters: it is
# the highest-yield source in the pipeline (28% of its rows shortlist, against
# 2.6% for greenhouse).

name: pipeline

on:
  # Manual only. There was a `schedule:` here (07:00 IST, then 14:00 IST) and it
  # failed EVERY run from the day it was written to 2026-09-05 -- the config
  # secrets were never set, so it exited at its first step without ever reaching
  # the pipeline, and nobody noticed because a failing scheduled workflow is
  # invisible unless you go looking.
  #
  # If you ever restore it: run after Google rolls the free-tier quota day at
  # midnight America/Los_Angeles (07:00 UTC in PDT, 08:00 in PST), never at
  # breakfast IST -- a 01:30 UTC run starts on the PREVIOUS quota day and
  # inherits whatever the evening already spent. `cron: "30 8 * * 1-5"` is past
  # the boundary in both halves of the year.
  workflow_dispatch:

concurrency:
  # The budget counter coordinates across processes on one box, not across
  # machines. Two runners at once would each think they own the full quota.
  group: jobpipe-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the job database
        uses: actions/cache@v4
        with:
          path: data
          key: jobpipe-db-${{ github.run_id }}
          restore-keys: jobpipe-db-

      - name: Write config from secrets
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          FACTS_YAML: ${{ secrets.FACTS_YAML }}
        run: |
          # profile.yaml and facts.yaml are gitignored -- they hold your work
          # history and your salary target. Paste each file's contents into a
          # repository secret of the same name.
          if [ -z "$PROFILE_YAML" ] || [ -z "$FACTS_YAML" ]; then
            echo "::error::PROFILE_YAML and/or FACTS_YAML repository secret is \
          not set, so this run has nothing to work from. Paste each file into a \
          secret of the same name at Settings > Secrets and variables > \
          Actions, or run 'make arm-ci' from a checkout with your real config. \
          Note this uploads your work history to GitHub -- that is why the \
          pipeline normally runs locally or on the OCI box instead."
            exit 1
          fi
          printf '%s' "$PROFILE_YAML" > config/profile.yaml
          printf '%s' "$FACTS_YAML"   > config/facts.yaml

      - name: Run the pipeline
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_SCORE: ${{ vars.MODEL_SCORE || 'gemini-flash-lite-latest' }}
          MODEL_TAILOR: ${{ vars.MODEL_TAILOR || 'gemini-flash-latest' }}
          # MEASURED, not guessed. 12 RPM produced sustained 429s and made
          # score.run() abort batches; 1200/day is fiction -- the real free-tier
          # cap is 500/day per model, and 20/day on gemini-flash-latest.
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '10' }}
          GEMINI_RPD_BUDGET: ${{ vars.GEMINI_RPD_BUDGET || '500' }}
          PII_DENY_TERMS: ${{ secrets.PII_DENY_TERMS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ALERT_MAX: ${{ vars.GMAIL_ALERT_MAX || '80' }}
          GMAIL_EXTRA_LINK_HINTS: ${{ vars.GMAIL_EXTRA_LINK_HINTS }}
        run: |
          # `daily`, not the five stages by hand. Running them individually has
          # no budget sizing (prepare asks for 30 calls against a 20/day cap and
          # dies halfway), no fallback when the tailor model is 503ing, and no
          # pdf stage -- which is how ten PDFs went missing on 2026-09-01.
          # -u because a runner that is cancelled or times out discards
          # everything still sitting in Python's block buffer.
          python -u -m jobpipe.cli daily

      - name: Keep the prepared documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
