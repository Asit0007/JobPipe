<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1319; --panel:#161C25; --panel-2:#1B2330; --rule:#28323F;
    --ink:#D9E1EA; --muted:#78899B;
    --signal:#E8A33D; --cool:#4FB3C9; --dead:#5A6675; --good:#6FBF8B;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{border-bottom:1px solid var(--rule);padding:20px 22px;
         display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.16em;
     text-transform:uppercase;margin:0;color:var(--muted)}
  .quota{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .quota b{color:var(--cool);font-weight:500}
  main{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  .banner{border:1px solid var(--rule);border-left:2px solid var(--signal);
    background:var(--panel);padding:12px 16px;margin-bottom:24px;
    font-size:13px;color:var(--muted)}
  .banner b{color:var(--ink);font-weight:600}

  .job{background:var(--panel);border:1px solid var(--rule);margin-bottom:14px}
  .job__top{display:flex;gap:18px;padding:18px}

  /* Signature: a threshold gauge, the way a singlestat panel reads a metric. */
  .gauge{flex:0 0 76px;text-align:left}
  .gauge__n{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;
            letter-spacing:-.02em}
  .gauge__bar{margin-top:8px;height:3px;background:var(--rule);position:relative}
  .gauge__fill{height:100%;background:currentColor}
  .gauge__tick{position:absolute;top:-2px;width:1px;height:7px;background:var(--dead)}
  .gauge__lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
              text-transform:uppercase;color:var(--muted);margin-top:7px}
  .t-hi{color:var(--good)} .t-mid{color:var(--signal)} .t-lo{color:var(--dead)}

  .meta{flex:1;min-width:0}
  .meta h2{font-size:16px;font-weight:600;margin:0 0 3px}
  .meta .co{font-family:var(--mono);font-size:12px;color:var(--cool)}
  .meta .co span{color:var(--muted)}
  .reason{font-size:13px;color:var(--muted);margin-top:9px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
        padding:3px 7px;border:1px solid var(--rule);color:var(--muted)}
  .chip--gap{border-color:#4A3C22;color:var(--signal)}
  .chip--flag{border-color:#4A2A2A;color:#C97A7A}

  .actions{display:flex;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
  button,a.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:9px 14px;background:transparent;
    border:1px solid var(--rule);color:var(--ink);cursor:pointer;
    text-decoration:none;display:inline-block;transition:.13s}
  button:hover,a.btn:hover{border-color:var(--muted)}
  a.btn--go{border-color:var(--cool);color:var(--cool)}
  a.btn--go:hover{background:var(--cool);color:var(--bg)}
  button.did{border-color:var(--good);color:var(--good)}
  button.did:hover{background:var(--good);color:var(--bg)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

  details{border-top:1px solid var(--rule)}
  summary{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:12px 18px;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ ";color:var(--signal)}
  details[open] summary::before{content:"- "}
  pre{margin:0;padding:0 18px 18px;white-space:pre-wrap;word-wrap:break-word;
      font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--muted)}

  .empty{border:1px dashed var(--rule);padding:44px 20px;text-align:center;color:var(--muted)}
  .empty code{font-family:var(--mono);color:var(--cool);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:520px){.job__top{flex-direction:column;gap:12px}.gauge{flex:none}}
</style>
</head>
<body>
<header>
  <h1>Review queue</h1>
  <div class="quota">gemini calls left today <b id="quota">--</b></div>
</header>

<main>
  <div class="banner">
    <b>Nothing here submits anything.</b> Open the posting, apply on the company's
    own site, then come back and record it. That boundary is why your LinkedIn and
    Naukri accounts stay intact.
  </div>
  <div id="list"></div>
</main>

<script>
const list = document.getElementById('list');

function tier(s){ return s >= 80 ? 't-hi' : s >= 68 ? 't-mid' : 't-lo'; }

function card(j){
  const el = document.createElement('article');
  el.className = 'job';
  const gaps = (j.missing||[]).slice(0,4).map(g=>`<span class="chip chip--gap">${g}</span>`).join('');
  const flags = (j.flags||[]).slice(0,3).map(f=>`<span class="chip chip--flag">${f}</span>`).join('');
  el.innerHTML = `
    <div class="job__top">
      <div class="gauge ${tier(j.score)}">
        <div class="gauge__n">${j.score ?? '--'}</div>
        <div class="gauge__bar">
          <div class="gauge__fill" style="width:${j.score||0}%"></div>
          <div class="gauge__tick" style="left:68%"></div>
          <div class="gauge__tick" style="left:80%"></div>
        </div>
        <div class="gauge__lbl">${j.source}</div>
      </div>
      <div class="meta">
        <h2>${j.title}</h2>
        <div class="co">${j.company} <span>&middot; ${j.location||'location not stated'}</span></div>
        <div class="reason">${j.reason||''}</div>
        <div class="chips">${gaps}${flags}</div>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn--go" href="${j.url}" target="_blank" rel="noopener">Open posting</a>
      <button class="did" data-act="applied" data-id="${j.id}">Mark applied</button>
      <button data-act="skip" data-id="${j.id}">Skip</button>
    </div>
    ${j.prep ? `<details><summary>Tailored bullets and screening answers</summary><pre>${
      j.prep.replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
    }</pre></details>` : ''}`;
  return el;
}

async function load(){
  const [jobs, stats] = await Promise.all([
    fetch('/api/queue').then(r=>r.json()),
    fetch('/api/stats').then(r=>r.json())
  ]);
  document.getElementById('quota').textContent = stats.gemini_left;
  list.innerHTML = '';
  if(!jobs.length){
    list.innerHTML = `<div class="empty">Queue is empty.<br><br>
      Run <code>make ingest &amp;&amp; make score &amp;&amp; make prepare</code> to fill it.</div>`;
    return;
  }
  jobs.forEach(j => list.appendChild(card(j)));
}

list.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if(!b) return;
  b.disabled = true;
  await fetch(`/api/jobs/${b.dataset.id}/${b.dataset.act}`, {method:'POST'});
  b.closest('.job').remove();
  if(!list.children.length) load();
});

load();
</script>
</body>
</html>
